# Release Please opens/updates a Release PR from conventional commits on main.
# When that PR is merged, Release Please creates the GitHub Release + v* tag,
# gate-ci-green verifies CI passed on the release SHA, then publish-hex publishes
# to Hex with HEX_API_KEY.
#
# Requires repository secret: HEX_API_KEY (Actions secrets).
# RELEASE_PLEASE_TOKEN: optional fine-grained PAT for Release Please PRs.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  gate-ci-green:
    name: Verify CI is green on release SHA
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Resolve tagged SHA
        id: resolve-sha
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.release-please.outputs.tag_name }}';
            const shaFromRelease = '${{ needs.release-please.outputs.sha }}';

            if (shaFromRelease) {
              core.setOutput('sha', shaFromRelease);
              return;
            }

            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tag}`
            });
            core.setOutput('sha', commit.data.sha);

      - name: Verify CI is green on tagged SHA
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.resolve-sha.outputs.sha }}';
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: sha,
              per_page: 10
            });

            if (data.total_count === 0) {
              core.setFailed(
                `Delivery blocked: no ci.yml runs found for SHA ${sha}. ` +
                'Push the release commit and let CI complete before publishing.'
              );
              return;
            }

            const latest = data.workflow_runs[0];
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: latest.id,
                per_page: 100
              }
            );

            const requiredPrefixes = ['Test (Elixir', 'Integration Tests'];
            const requiredJobs = jobs.filter((job) =>
              requiredPrefixes.some((prefix) => job.name.startsWith(prefix))
            );

            if (requiredJobs.length === 0) {
              core.setFailed(
                `Delivery blocked: no required test jobs found in ci.yml run ${latest.html_url}`
              );
              return;
            }

            const blockingFailures = requiredJobs.filter(
              (job) => job.conclusion !== 'success' && job.conclusion !== 'skipped'
            );

            if (blockingFailures.length > 0) {
              const detail = blockingFailures
                .map((job) => `  - ${job.name} (${job.conclusion})`)
                .join('\n');
              core.setFailed(
                `Delivery blocked: required ci.yml jobs failed on SHA ${sha}.\n${detail}\nRun: ${latest.html_url}`
              );
              return;
            }

            const lintJob = jobs.find((job) => job.name === 'Lint');
            if (lintJob && lintJob.conclusion !== 'success') {
              core.warning(
                `Lint job concluded ${lintJob.conclusion}; publish allowed because ` +
                'Test + Integration jobs passed (pre-existing Credo debt tracked separately).'
              );
            }

            core.info(`Required ci.yml jobs succeeded on release SHA ${sha}`);

  publish-hex:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    needs: [release-please, gate-ci-green]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache library deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch library deps
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Verify release version in mix.exs
        run: grep -n "@version \"${RELEASE_VERSION}\"" mix.exs

      - name: Run library tests
        env:
          MIX_ENV: test
        run: mix test

      - name: Build docs and Hex package
        run: |
          mix docs
          mix hex.build

      - name: Skip if version already on Hex
        id: idempotency
        run: |
          if mix hex.info lattice_stripe "${RELEASE_VERSION}" 2>/dev/null | grep -q "Released:"; then
            echo "Version ${RELEASE_VERSION} of lattice_stripe already on Hex — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry run Hex publish
        if: steps.idempotency.outputs.skip != 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --dry-run --yes

      - name: Publish to Hex
        if: steps.idempotency.outputs.skip != 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      - name: Verify version on Hex.pm
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS "https://hex.pm/api/packages/lattice_stripe/releases/${RELEASE_VERSION}" | grep -q "\"version\""; then
              echo "Hex.pm lists lattice_stripe ${RELEASE_VERSION}"
              exit 0
            fi
            echo "waiting for Hex index... (${i}/36)"
            sleep 10
          done
          echo "Timed out waiting for https://hex.pm/api/packages/lattice_stripe/releases/${RELEASE_VERSION}"
          exit 1
