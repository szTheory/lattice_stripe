name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".planning/**"
  pull_request:
    paths-ignore:
      - ".planning/**"
  workflow_dispatch:
    # Dispatched by release.yml when a Release PR is open but bot pushes skip pull_request CI.

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-1.19-28-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-1.19-28-mix-

      - name: Cache _build
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-1.19-28-build-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-1.19-28-build-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

  compile:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-1.19-28-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-1.19-28-mix-

      - name: Cache _build
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-1.19-28-build-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-1.19-28-build-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings-as-errors
        run: mix compile --warnings-as-errors

  test:
    name: "Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - elixir: '1.15'
            otp: '26'
          - elixir: '1.17'
            otp: '27'
          - elixir: '1.19'
            otp: '28'
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-mix-

      - name: Cache _build
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-build-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-build-

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test

      - name: Tax adoption contract
        if: matrix.elixir == '1.19' && matrix.otp == '28'
        run: mix test test/lattice_stripe/tax/adoption_contract_test.exs --warnings-as-errors

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports:
          - '12111:12111'
          - '12112:12112'
    env:
      STRIPE_MOCK_HOST: localhost
      STRIPE_MOCK_PORT: '12111'
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-1.19-28-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-1.19-28-mix-

      - name: Cache _build
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-1.19-28-build-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-1.19-28-build-

      - name: Install dependencies
        run: mix deps.get

      - name: Run integration tests
        run: mix test --include integration

  docs_truth:
    name: Docs Truth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-1.19-28-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-1.19-28-mix-

      - name: Cache _build
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-1.19-28-build-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-1.19-28-build-

      - name: Install dependencies
        run: mix deps.get

      - name: Run docs_truth regression suite
        run: mix test test/lattice_stripe/docs_truth_test.exs

      # Also runs inside the `test` matrix on 1.15/1.17/1.19, which is what proves the
      # snapshot is byte-identical across Elixir versions. This lane exists so the failure
      # surfaces under a named step instead of buried in a matrix leg.
      - name: Public API surface lock
        run: mix test test/lattice_stripe/api_surface_lock_test.exs

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-1.19-28-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-1.19-28-mix-

      - name: Cache _build
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-1.19-28-build-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-1.19-28-build-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Credo
        run: mix credo --strict

      - name: Build docs
        # --warnings-as-errors matches the local `mix ci` alias. Without it this
        # lane exited 0 on broken references, so `mix ci` was strictly stronger
        # than the required ci-gate and doc warnings could never fail a PR.
        run: mix docs --warnings-as-errors

      - name: Build Hex package
        run: mix hex.build

      - name: Audit dependencies
        run: mix deps.audit

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [format, compile, test, integration, docs_truth, quality]
    if: always()
    steps:
      - name: Verify required CI lanes
        env:
          FORMAT: ${{ needs.format.result }}
          COMPILE: ${{ needs.compile.result }}
          TEST: ${{ needs.test.result }}
          INTEGRATION: ${{ needs.integration.result }}
          DOCS_TRUTH: ${{ needs.docs_truth.result }}
          QUALITY: ${{ needs.quality.result }}
        run: |
          set -euo pipefail
          failed=0
          for lane in FORMAT COMPILE TEST INTEGRATION DOCS_TRUTH QUALITY; do
            result="${!lane}"
            if [[ "$result" != "success" ]]; then
              echo "Required lane $lane: $result"
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "ci-gate failed: one or more required lanes did not succeed."
            exit 1
          fi
          echo "ci-gate passed: all required lanes succeeded."
