name: Bug Report
description: Report a bug in LatticeStripe
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the information below.
  - type: input
    id: version
    attributes:
      label: LatticeStripe Version
      description: "Which version of LatticeStripe are you using?"
      placeholder: "2.2.0"
    validations:
      required: true
  - type: input
    id: stripe-api-version
    attributes:
      label: Stripe API Version
      description: "The version configured for the account or request, if known."
      placeholder: "2026-03-25.dahlia"
    validations:
      required: false
  - type: input
    id: elixir-version
    attributes:
      label: Elixir / OTP Version
      description: "Output of `elixir --version`"
      placeholder: "Elixir 1.19.5 (compiled with Erlang/OTP 28)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "A clear description of the bug."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: "Provide the smallest runnable call or test that reproduces the behavior, with secrets and customer data removed."
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: "What you expected to happen."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: "What actually happened? Include the LatticeStripe error shape, Stripe request_id, and a redacted stack trace when available."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: "Any other context, logs, or screenshots."
    validations:
      required: false
